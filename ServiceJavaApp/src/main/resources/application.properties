# ===================================================================
# Configuration BDL RTGS ServiceJavaApp
# Surveillance EDI, Substitution RIB Interne & Reconstitution
# ===================================================================
server.port=8085
spring.application.name=BDL-RTGS-ServiceJavaApp

# --- Répertoires de Surveillance & Traitement ---
# Dossier où les clients déposent les fichiers EDI bruts (VIRM...)
rtgs.folder.inbox=./data/inbox_edi

# Dossier où sont déposés les fichiers EDI modifiés (RIB substitué par compte interne pour comptabilisation Core Banking)
rtgs.folder.out-core-banking=./data/out_core_banking

# Dossier où sont reçues les confirmations de comptabilisation (ex: SI_VIR_CPT_*.txt ou .ack)
rtgs.folder.inbox-compta=./data/inbox_compta

# Dossier où sont générés les fichiers reconstitués avec le RIB d'origine pour envoi RTGS / SWIFT
rtgs.folder.out-reconstituted=./data/out_reconstituted

# Dossier d'archive des fichiers originaux
rtgs.folder.archive=./data/archive_edi

# Dossier pour les fichiers rejetés ou non conformes
rtgs.folder.rejected=./data/rejected_edi

# --- Règles Métier BDL ---
# Seuil minimum d'éligibilité RTGS en DZD (1 000 000 DZD)
rtgs.rules.min-amount=1000000.00

# Code Banque BDL (Donneur d'ordre standard BDL = 005)
rtgs.rules.code-banque-bdl=005

# RIB Compte Interne / Transit de Règlement BDL (20 positions : Banque 3 + Agence 5 + Compte 10 + Clé 2)
# Utilisé pour remplacer le RIB donneur d'ordre lors de la phase de comptabilisation intermédiaire
rtgs.compte.interne.rib=00500133400218153023
rtgs.compte.interne.nom=BDL COMPTE TRANSIT REGLEMENT RTGS
rtgs.compte.interne.adresse=DIRECTION GENERALE BDL ALGER

# --- Planification & Polling (en millisecondes) ---
# Intervalle de scrutation du dossier entrant EDI (ex: 5000 ms = 5s)
rtgs.polling.inbox-interval-ms=5000

# Intervalle de vérification des retours de comptabilisation (ex: 10000 ms = 10s)
rtgs.polling.compta-interval-ms=10000

# Mode auto-confirmation pour démonstration / simulateur (true = comptabilisation simulée automatique après délai)
rtgs.simulation.auto-compta=true
rtgs.simulation.auto-compta-delay-ms=15000

# Fichier persistant du registre des transactions
rtgs.registry.file-path=./data/registry_transactions.json

# Logging
logging.level.root=INFO
logging.level.dz.bdl.rtgs=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
