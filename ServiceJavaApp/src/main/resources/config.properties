# ===================================================================
# Configuration BDL RTGS ServiceJavaApp (Pure Java Standard)
# Surveillance EDI, Substitution RIB Interne & Reconstitution
# ===================================================================

# --- Répertoires de Surveillance & Traitement ---
rtgs.folder.inbox=./data/inbox_edi
rtgs.folder.out-core-banking=./data/out_core_banking
rtgs.folder.inbox-compta=./data/inbox_compta
rtgs.folder.out-reconstituted=./data/out_reconstituted
rtgs.folder.archive=./data/archive_edi
rtgs.folder.rejected=./data/rejected_edi

# --- Règles Métier BDL ---
# Seuil minimum d'éligibilité RTGS en DZD (1 000 000 DZD)
rtgs.rules.min-amount=1000000.00

# Code Banque BDL (Donneur d'ordre standard BDL = 005)
rtgs.rules.code-banque-bdl=005

# RIB Compte Interne / Transit de Règlement BDL (20 positions)
rtgs.compte.interne.rib=00500133400218153023
rtgs.compte.interne.nom=BDL COMPTE TRANSIT REGLEMENT RTGS
rtgs.compte.interne.adresse=DIRECTION GENERALE BDL ALGER

# --- Planification & Scrutation (en secondes) ---
# Intervalle de scrutation du dossier entrant EDI (en secondes)
rtgs.polling.inbox-interval-seconds=5

# Intervalle de vérification des retours de comptabilisation (en secondes)
rtgs.polling.compta-interval-seconds=10

# Mode auto-confirmation pour simulation / tests (true / false)
rtgs.simulation.auto-compta=true
rtgs.simulation.auto-compta-delay-seconds=15

# Fichier persistant du registre des transactions (JSON)
rtgs.registry.file-path=./data/registry_transactions.json

# Port du serveur HTTP léger de statut embarqué (0 pour désactiver)
rtgs.http.server.port=8085
